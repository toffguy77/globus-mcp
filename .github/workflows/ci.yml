name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Тесты
        run: pytest

      - name: Сервер поднимается и регистрирует инструменты
        run: |
          python - <<'PY'
          import asyncio, os, tempfile
          os.environ["GLOBUS_MCP_HOME"] = tempfile.mkdtemp()
          from globus_mcp import server
          assert server._client is None, "клиент не должен создаваться на импорте"
          tools = asyncio.run(server.mcp.list_tools())
          assert len(tools) == 22, f"ожидалось 22 инструмента, получено {len(tools)}"
          assert all(t.description for t in tools), "у инструмента нет описания"
          print(f"ok: {len(tools)} инструментов")
          PY

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка ruff
        run: pip install ruff

      - name: Линтер
        run: ruff check --output-format=github .

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Сборка пакета
        run: |
          pip install build twine
          python -m build
          twine check dist/*
